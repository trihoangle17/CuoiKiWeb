<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - PCShop</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container">
    <form class="form-page" id="login-form" novalidate>
      <h1>Đăng nhập</h1>
      <p class="subtitle">Đăng nhập để theo dõi đơn hàng và nhận ưu đãi</p>

      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" placeholder="email@example.com">
        <div class="form-error" data-error-for="email"></div>
      </div>

      <div class="form-group">
        <label for="login-password">Mật khẩu</label>
        <input type="password" id="login-password" name="password" placeholder="Nhập mật khẩu">
        <div class="form-error" data-error-for="password"></div>
      </div>

      <button type="submit" class="btn btn-primary">Đăng nhập</button>

      <div class="form-footer-link">
        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
      </div>
    </form>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
