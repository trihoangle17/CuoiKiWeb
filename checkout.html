<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh toán - PCShop</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container">
    <nav class="breadcrumb"><a href="index.html">Trang chủ</a> / <a href="cart.html">Giỏ hàng</a> / <span>Thanh toán</span></nav>

    <div class="checkout-layout">
      <form class="form-page" id="checkout-form" novalidate>
        <h1>Thông tin giao hàng</h1>
        <p class="subtitle">Vui lòng điền đầy đủ thông tin để hoàn tất đơn hàng</p>

        <div class="form-group">
          <label for="fullname">Họ và tên</label>
          <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn A">
          <div class="form-error" data-error-for="fullname"></div>
        </div>

        <div class="form-group">
          <label for="phone">Số điện thoại</label>
          <input type="tel" id="phone" name="phone" placeholder="09xxxxxxxx">
          <div class="form-error" data-error-for="phone"></div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="email@example.com">
          <div class="form-error" data-error-for="email"></div>
        </div>

        <div class="form-group">
          <label for="address">Địa chỉ nhận hàng</label>
          <textarea id="address" name="address" rows="3" placeholder="Số nhà, đường, quận/huyện, tỉnh/thành"></textarea>
          <div class="form-error" data-error-for="address"></div>
        </div>

        <div class="form-group">
          <label for="payment">Phương thức thanh toán</label>
          <select id="payment" name="payment">
            <option value="cod">Thanh toán khi nhận hàng (COD)</option>
            <option value="bank">Chuyển khoản ngân hàng</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Đặt hàng</button>
      </form>

      <div class="summary-box" id="checkout-summary"></div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>
