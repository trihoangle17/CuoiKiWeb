services:
  db:
    image: mysql:8.0
    container_name: noteapp_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: noteapp
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noteapp_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: noteapp
      DB_USER: root
      DB_PASS: rootpassword
      WS_HOST: 0.0.0.0
      WS_PORT: "8081"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./public/uploads:/var/www/html/public/uploads

  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noteapp_ws
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: php websocket/server.php
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: noteapp
      DB_USER: root
      DB_PASS: rootpassword
      WS_HOST: 0.0.0.0
      WS_PORT: "8081"
      TZ: Asia/Ho_Chi_Minh

volumes:
  mysql_data:
