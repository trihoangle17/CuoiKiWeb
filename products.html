<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm - PCShop</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container">
    <nav class="breadcrumb"><a href="index.html">Trang chủ</a> / <span>Sản phẩm</span></nav>

    <div class="listing-layout">
      <aside class="filters">
        <h3>Bộ lọc</h3>

        <div class="filter-group">
          <label>Danh mục</label>
          <select id="filter-category">
            <option value="">Tất cả danh mục</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Thương hiệu</label>
          <select id="filter-brand">
            <option value="">Tất cả thương hiệu</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Giá tối đa: <span id="price-value"></span></label>
          <input type="range" id="filter-price" min="0" max="40000000" step="500000">
        </div>

        <div class="filter-group">
          <label>Sắp xếp</label>
          <select id="filter-sort">
            <option value="default">Mặc định</option>
            <option value="price-asc">Giá tăng dần</option>
            <option value="price-desc">Giá giảm dần</option>
            <option value="rating-desc">Đánh giá cao nhất</option>
          </select>
        </div>

        <button class="btn btn-outline" id="reset-filters" style="width:100%">Xóa lọc</button>
      </aside>

      <section>
        <div class="listing-toolbar">
          <span class="result-count" id="result-count"></span>
        </div>
        <div class="product-grid" id="product-grid"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/products.js"></script>
</body>
</html>
